<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reforge environment reconstruction" />
    <title>Reforge</title>
    <script>
      try {
        document.documentElement.classList.add(localStorage.getItem('reforge:theme') === 'light' ? 'light' : 'dark');
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
