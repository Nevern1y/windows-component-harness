[workspace]
resolver = "2"
members = [
    "crates/reforge-domain",
    "crates/reforge-platform-windows",
    "crates/reforge-discovery",
    "crates/reforge-package",
    "crates/reforge-restore",
    "crates/reforge-cli",
    "crates/reforge-elevation-helper",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
age = { version = "0.12.1", features = ["armor"] }
async-trait = "0.1.89"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
blake3 = "1.8"
ed25519-dalek = "2.2.0"
reforge-domain = { path = "crates/reforge-domain" }
reforge-elevation-helper = { path = "crates/reforge-elevation-helper" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
reforge-platform-windows = { path = "crates/reforge-platform-windows" }
reforge-discovery = { path = "crates/reforge-discovery" }
reforge-package = { path = "crates/reforge-package" }
reforge-cli = { path = "crates/reforge-cli" }
reforge-restore = { path = "crates/reforge-restore" }
tauri = "2.11.5"
tauri-plugin-dialog = "2.7.2"
tauri-build = "2.6.3"
crossterm = "0.29.0"
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3.1"
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
uuid = { version = "1.18", features = ["v7"] }
url = "2.5"
zstd = "0.13.3"
zeroize = { version = "1.9.0", features = ["serde"] }
zip = { version = "8.6.0", default-features = false }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Management_Deployment",
    "Wdk_System_SystemServices",
    "Win32",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]}
